name: GitHub Pages – Anatomie Motion 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build v2.8 independent elbow calibration
        run: python3 scripts/elbow-calibration-v28.py
      - name: Build v2.9 automatic elbow calibration
        run: python3 scripts/auto-elbows-v29.py
      - name: Build v3.0 experimental knee hip shoulder analysis
        run: python3 scripts/extra-joints-v30.py
      - name: Verify published pages
        run: |
          test -s index.html
          test -s rig-labor-v2.9.html
          test -s rig-labor-v3.0.html
          ls -lh index.html rig-labor-v2.9.html rig-labor-v3.0.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
