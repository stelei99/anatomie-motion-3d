<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bewegungsanatomie · Anatomie Motion 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#052640;color:#eaf7fd;font:16px system-ui}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:1.5rem;margin:0 0 12px}.tools,fieldset{display:flex;flex-wrap:wrap;gap:12px;align-items:center}fieldset{border:1px solid #48738b;border-radius:10px;margin:12px 0}button,select{font:inherit;background:#07345b;color:white;border:1px solid #6997ad;padding:8px;border-radius:6px}canvas{width:100%;height:clamp(350px,61vh,700px);background:radial-gradient(ellipse at 50% 43%,#29485a 0%,#183549 43%,#0c273b 80%,#092236 100%);box-shadow:inset 0 0 0 1px #37566b;min-height:260px;display:block;border-radius:10px;touch-action:none}input{accent-color:#08a9ef}#phase{flex:1;min-width:90px}small,a{color:#c5e6f3}#status{min-height:1.4em}label{white-space:nowrap}
</style><main><h1>Bewegungsanatomie</h1><div class="tools"><label for="exercise">Übung</label><select id="exercise"></select><button id="side">Seite</button><button id="front">Vorne</button></div>
<fieldset><legend>Anatomische Ebenen</legend><label><input type="checkbox" id="muscles" checked> Muskeln</label><label><input type="checkbox" id="bones" checked> Knochen</label><label><input type="checkbox" id="joints" checked> Gelenkzentren</label></fieldset>
<canvas id="view" aria-label="Drehbares anatomisches Modell"></canvas><strong id="selection" role="status"></strong><p id="status" role="status">Anatomiemodell wird geladen …</p><div class="tools"><button id="play" disabled>Abspielen</button><label for="phase">Bewegung</label><input id="phase" disabled type="range" min="0" max="100" value="0"><output id="percent">0 %</output></div><p id="groups"></p><small>Dunkelrot markiert die hervorgehobenen Muskelgruppen. Gelbe Punkte markieren geschätzte Gelenkzentren. Die Bewegungen sind kinematische Annäherungen. <a href="index.html">Zum Anatomieatlas</a></small></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js"></script>
<script>
(async()=>{
const el=id=>document.getElementById(id), V=()=>new THREE.Vector3(), rad=THREE.MathUtils.degToRad;
const renderer=new THREE.WebGLRenderer({canvas:el('view'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,100),orbit=new THREE.OrbitControls(camera,el('view'));
scene.add(new THREE.HemisphereLight(0xfff4e8,0x8ca3b3,.78));
const keyLight=new THREE.DirectionalLight(0xfff0df,.86);keyLight.position.set(-3,4,3);scene.add(keyLight);
const rimLight=new THREE.DirectionalLight(0xc3e5ff,.52);rimLight.position.set(2,2,-3);scene.add(rimLight);
const exercises={
 squat:['Kniebeuge','Quadrizeps und Gesäß',/quadriceps|gluteal/,{shin:28,thigh:-65,trunk:32,front:60}],
 quarter:['Viertelkniebeuge','Quadrizeps und Gesäß',/quadriceps|gluteal/,{shin:14,thigh:-28,trunk:13,front:28}],
 hinge:['Hüftbeuge / Good Morning','Gesäß, Beinbeuger und Rückenstrecker',/gluteal|hamstrings|back_muscles/,{shin:2,thigh:-16,trunk:60}],
 calf:['Wadenheben','Waden',/^calf/,{heel:24}],
 curl:['Armbeugen beidseits','Oberarmbeuger',/upper_arm_muscles/,{curl:108}],
 alt:['Armbeugen im Wechsel','Oberarmbeuger',/upper_arm_muscles/,{alternate:105}],
 lateral:['Seitheben','Deltamuskeln',/deltoid/,{side:73,curl:10}],
 raise:['Frontheben','Vordere Schulter',/deltoid/,{front:78,curl:8}],
 row:['Vorgebeugtes Rudern','Rücken, hintere Schulter und Oberarmbeuger',/back_muscles|deltoid|upper_arm_muscles/,{row:true}]
};
for(const [key,[label]] of Object.entries(exercises))el('exercise').add(new Option(label,key));
const loader=new THREE.GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const {scene:source}=await loader.loadAsync('https://cdn.jsdelivr.net/npm/open-anatomy-3d@0.1.0/models/anatomy-male.glb');
source.updateMatrixWorld(true);
const parts=[],lookup={},markers=[];
for(const layer of ['skeleton','muscles']){
 source.getObjectByName(layer).traverse(mesh=>{
  if(!mesh.isMesh)return;
  const item={mesh,layer,name:mesh.name};parts.push(item);lookup[mesh.name]=mesh;
 });
}
// Average the vertices near each bone end in world space.
function end(name,top){
 const mesh=lookup[name],attr=mesh.geometry.attributes.position,box=new THREE.Box3().setFromObject(mesh),sum=V(),v=V();
 const span=box.max.y-box.min.y,limit=top?box.max.y-span*.12:box.min.y+span*.12;let count=0;
 for(let i=0;i<attr.count;i++){v.fromBufferAttribute(attr,i).applyMatrix4(mesh.matrixWorld);if(top?v.y>=limit:v.y<=limit){sum.add(v);count++}}
 return count?sum.divideScalar(count):box.getCenter(sum);
}
function joint(parent,point,show=true){
 const g=new THREE.Group();parent.add(g);g.position.copy(parent.worldToLocal(point.clone()));g.updateMatrixWorld(true);
 if(show){const marker=new THREE.Mesh(new THREE.SphereGeometry(.011,16,12),new THREE.MeshBasicMaterial({color:0xffcb05,depthTest:false}));marker.renderOrder=3;g.add(marker);markers.push(marker)}
 return g;
}
const mid=(a,b)=>a.clone().lerp(b,.5),hipMid=mid(end('femur_l',true),end('femur_r',true));
const pelvis=joint(scene,hipMid,false),trunk=joint(pelvis,hipMid,false),limbs={};
for(const s of ['l','r']){
 const at=(n,t)=>end(n+'_'+s,t);
 const footBox=new THREE.Box3().setFromObject(lookup['foot_'+s]);
 const toe=footBox.getCenter(V());toe.z=footBox.max.z;toe.y=footBox.min.y;
 const foot=joint(scene,toe,false),shin=joint(foot,at('lower_leg',false));
 const thigh=joint(shin,mid(at('lower_leg',true),at('femur',false))),hip=joint(thigh,at('femur',true));
 const arm=joint(trunk,at('humerus',true)),forearm=joint(arm,mid(at('humerus',false),at('forearm',true))),hand=joint(forearm,mid(at('forearm',false),at('hand',true)));
 limbs[s]={foot,shin,thigh,hip,arm,forearm,hand};
}
// Atlas muscle groups include tendons crossing one or more joints. Blend
// each vertex between the adjacent segments in the original standing pose.
function bindLegMuscle(part, limb){
 const segments=[limb.foot,limb.shin,limb.thigh,pelvis,trunk];
 const ankle=limb.shin.getWorldPosition(V()).y,knee=limb.thigh.getWorldPosition(V()).y,hip=limb.hip.getWorldPosition(V()).y;
 const leg=hip-ankle;
 const limits=[[ankle,.035],[knee,.085],[hip,.13],[hip+.18*leg,.045]];
 bindAcrossJoints(part,segments,limits.map(([center,width])=>[center,width*leg]));
}
function bindArmMuscle(part,limb){
 const wrist=limb.hand.getWorldPosition(V()).y,elbow=limb.forearm.getWorldPosition(V()).y;
 const forearmLength=limb.hand.position.length(),upperLength=limb.forearm.position.length();
 bindAcrossJoints(part,[limb.hand,limb.forearm,limb.arm],[
  [wrist,forearmLength*.13],[elbow,upperLength*.22]
 ]);
}
function bindAcrossJoints(part,segments,limits){
 const original=part.mesh,geometry=original.geometry.clone();
 const position=geometry.attributes.position,indices=[],weights=[],point=V();
 for(let i=0;i<position.count;i++){
  point.fromBufferAttribute(position,i).applyMatrix4(original.matrixWorld);
  let from=0,blend=0;
  for(const [center,radius] of limits){
   if(point.y<center+radius){
    blend=THREE.MathUtils.smoothstep(point.y,center-radius,center+radius);
    break;
   }
   from++;
  }
  indices.push(from,Math.min(from+1,segments.length-1),0,0);
  weights.push(1-blend,blend,0,0);
 }
 geometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(indices,4));
 geometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(weights,4));
 const skinned=new THREE.SkinnedMesh(geometry,original.material);
 skinned.name=part.name;
 original.matrixWorld.decompose(skinned.position,skinned.quaternion,skinned.scale);
 scene.add(skinned);skinned.updateMatrixWorld(true);
 skinned.bind(new THREE.Skeleton(segments),skinned.matrixWorld.clone());
 skinned.frustumCulled=false;
 part.mesh=skinned;
}
for(const p of parts){
 const n=p.name,L=limbs[n.slice(-1)];let parent=trunk;
 if(/^pelvis|^pelvic_floor|^gluteal|^iliopsoas/.test(n))parent=pelvis;
 else if(L){
  if(/^(foot)/.test(n))parent=L.foot;
  if(/^(calf|lower_leg|shin_muscles|patella)/.test(n))parent=L.shin;
  if(/^(femur|hamstrings|adductors|quadriceps)/.test(n))parent=L.thigh;
  if(/^(humerus|upper_arm|deltoid)/.test(n))parent=L.arm;
  if(/^forearm/.test(n))parent=L.forearm;
  if(/^hand/.test(n))parent=L.hand;
 }
 if(p.layer==='muscles'&&L&&/^(gluteal|iliopsoas|quadriceps|adductors|hamstrings|calf|shin_muscles)_/.test(n))bindLegMuscle(p,L);
 else if(p.layer==='muscles'&&L&&/^(upper_arm_muscles|forearm_muscles|hand_muscles)_/.test(n))bindArmMuscle(p,L);
 else parent.attach(p.mesh);
 p.mesh.material=new THREE.MeshStandardMaterial({roughness:.8,side:THREE.DoubleSide});
}
const names={
 spine_cervical:'Halswirbelsäule',spine_thoracic:'Brustwirbelsäule',spine_lumbar:'Lendenwirbelsäule',
 sternum:'Brustbein',foot:'Fußknochen',hand:'Handknochen',skull:'Schädel',teeth:'Zähne',mandible:'Unterkiefer',
 clavicle:'Schlüsselbein',ribs:'Rippen',femur:'Oberschenkelknochen',lower_leg:'Schienbein und Wadenbein',
 pelvis:'Becken',humerus:'Oberarmknochen',patella:'Kniescheibe',forearm:'Elle und Speiche',scapula:'Schulterblatt',
 chest_muscles:'Brustmuskulatur',foot_muscles:'Fußmuskulatur',hand_muscles:'Handmuskulatur',
 deltoid:'Deltamuskel',trapezius:'Trapezmuskel',diaphragm:'Zwerchfell',pelvic_floor:'Beckenbodenmuskulatur',
 intercostals:'Zwischenrippenmuskulatur',forearm_muscles:'Unterarmmuskulatur',neck_muscles:'Halsmuskulatur',
 calf:'Wadenmuskulatur',upper_arm_muscles:'Oberarmmuskulatur',back_muscles:'Rückenmuskulatur',
 adductors:'Adduktoren des Oberschenkels',shin_muscles:'Schienbeinmuskulatur',abdominal_muscles:'Bauchmuskulatur',
 gluteal:'Gesäßmuskulatur',iliopsoas:'Lendendarmbeinmuskel',rotator_cuff:'Rotatorenmanschette',
 shoulder_muscles:'Schultermuskulatur',quadriceps:'Vierköpfiger Oberschenkelmuskel (Quadrizeps)',hamstrings:'Hintere Oberschenkelmuskulatur'
};
function partName(name){
 const side=name.match(/_([lr])$/);
 return (names[name.replace(/_[lr]$/,'')]||name)+(side?(side[1]==='l'?' · links':' · rechts'):'');
}
// Render one pixel with the same skinning and depth test as the displayed pose.
const pickTarget=new THREE.WebGLRenderTarget(1,1),pickCamera=new THREE.PerspectiveCamera();
const pixel=new Uint8Array(4),canvas=el('view');
for(const [index,p] of parts.entries()){
 p.surface=p.mesh.material;
 p.pickMaterial=new THREE.MeshBasicMaterial({color:index+1,side:THREE.DoubleSide,toneMapped:false});
}
function identify(event){
 const rect=canvas.getBoundingClientRect(),w=canvas.width,h=canvas.height;
 const x=Math.floor((event.clientX-rect.left)*w/rect.width),y=Math.floor((event.clientY-rect.top)*h/rect.height);
 if(x<0||x>=w||y<0||y>=h)return;
 pickCamera.copy(camera);pickCamera.layers.set(0);pickCamera.setViewOffset(w,h,x,y,1,1);
 const results=[],originalTarget=renderer.getRenderTarget(),background=renderer.getClearColor(new THREE.Color());
 try{
  renderer.setRenderTarget(pickTarget);renderer.setClearColor(0);
  for(const marker of markers)marker.visible=false;
  for(const [layer,toggle,label] of [['muscles','muscles','Muskel'],['skeleton','bones','Skelett']]){
   if(!el(toggle).checked)continue;
   for(const p of parts){p.mesh.visible=p.layer===layer;p.mesh.material=p.pickMaterial}
   renderer.render(scene,pickCamera);
   renderer.readRenderTargetPixels(pickTarget,0,0,1,1,pixel);
   const hit=parts[pixel[2]-1];
   if(hit)results.push(label+' · '+partName(hit.name));
  }
 }finally{
  for(const p of parts){p.mesh.material=p.surface;p.mesh.visible=el(p.layer==='muscles'?'muscles':'bones').checked}
  for(const m of markers)m.visible=el('joints').checked;
  renderer.setRenderTarget(originalTarget);renderer.setClearColor(background,0);
 }
 el('selection').textContent=results.join('   |   ')||'Keine Struktur an dieser Stelle getroffen.';
}
let tap=null;
canvas.addEventListener('pointerdown',e=>{
 tap=e.isPrimary&&e.button===0?{id:e.pointerId,x:e.clientX,y:e.clientY}:null;
});
canvas.addEventListener('pointermove',e=>{
 if(tap&&e.pointerId===tap.id&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>6)tap=null;
});
canvas.addEventListener('pointercancel',()=>{tap=null});
canvas.addEventListener('pointerup',e=>{
 if(tap&&tap.id===e.pointerId&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<=6)identify(e);
 tap=null;
});

function appearance(){
 el('selection').textContent='';
 const [,label,active]=exercises[el('exercise').value];el('groups').textContent='Hervorgehoben: '+label;
 for(const {mesh,layer,name} of parts){
  const muscle=layer==='muscles',overlay=muscle&&el('bones').checked;
  mesh.visible=el(muscle?'muscles':'bones').checked;
  const mat=mesh.material;mat.color.setHex(muscle?(active.test(name)?0x9f2536:0x939ca4):0xeadcc4);
  mat.transparent=overlay;mat.opacity=overlay?(active.test(name)?.83:.33):1;mat.depthWrite=!overlay;mat.needsUpdate=true;
 }
 for(const m of markers)m.visible=el('joints').checked;
}
let phase=0,playing=false,time=0;
function pose(value){
 phase=value;const cfg=exercises[el('exercise').value][3],angle=k=>rad(cfg[k]||0)*value;
 const lean=cfg.row?rad(48):angle('trunk'),shin=cfg.row?rad(3):angle('shin'),thigh=cfg.row?rad(-15):angle('thigh');
 for(const [s,L] of Object.entries(limbs)){
  L.foot.rotation.x=angle('heel');L.shin.rotation.x=shin-L.foot.rotation.x;L.thigh.rotation.x=thigh-shin;
  const raise=cfg.row?lean-rad(68)*value:angle('front');
  L.arm.rotation.order='ZXY';L.arm.rotation.x=-raise;L.arm.rotation.z=(s==='l'?1:-1)*angle('side');
  const fraction=cfg.alternate?(s==='l'?value:1-value):0;
  L.forearm.rotation.x=-(angle('curl')+rad(cfg.alternate||0)*fraction+(cfg.row?rad(84)*value:0));
 }
 pelvis.position.copy(mid(limbs.l.hip.getWorldPosition(V()),limbs.r.hip.getWorldPosition(V())));
 trunk.rotation.x=lean;el('phase').value=Math.round(value*100);el('percent').textContent=el('phase').value+' %';
}
function pause(){playing=false;el('play').textContent='Abspielen'}
el('exercise').onchange=()=>{pause();pose(0);appearance()};
for(const k of ['bones','joints','muscles'])el(k).onchange=appearance;
el('phase').oninput=()=>{pause();pose(Number(el('phase').value)/100)};
el('play').onclick=()=>{if(playing)return pause();time=Math.acos(1-2*phase);playing=true;el('play').textContent='Pause'};
const bounds=new THREE.Box3();
for(const {mesh} of parts)bounds.expandByObject(mesh);
const target=bounds.getCenter(V()),height=bounds.getSize(V()).y;
// A soft contact shadow grounds the figure and stays outside anatomical picking.
const shadowCanvas=document.createElement('canvas');
shadowCanvas.width=shadowCanvas.height=128;
const ctx=shadowCanvas.getContext('2d'),gradient=ctx.createRadialGradient(64,64,0,64,64,64);
gradient.addColorStop(0,'rgba(2,12,21,.68)');gradient.addColorStop(.45,'rgba(2,12,21,.38)');gradient.addColorStop(1,'rgba(2,12,21,0)');
ctx.fillStyle=gradient;ctx.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(height*.62,height*.39),
 new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(target.x,bounds.min.y-.006,target.z);
shadow.layers.set(1);shadow.renderOrder=-1;scene.add(shadow);camera.layers.enable(1);
orbit.target.copy(target);orbit.enablePan=false;
function cameraAt(x,z){const distance=height*1.78;camera.position.copy(target).add(new THREE.Vector3(x,.095,z).normalize().multiplyScalar(distance));orbit.update()}
el('side').onclick=()=>cameraAt(1,0);el('front').onclick=()=>cameraAt(0,1);
new ResizeObserver(()=>{const c=el('view');renderer.setSize(c.clientWidth,c.clientHeight,false);camera.aspect=c.clientWidth/c.clientHeight;
 // Leave room for both arms in portrait when the user selects lateral raises.
 camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(rad(35)/2)*Math.max(1,.91/camera.aspect)));
 camera.updateProjectionMatrix()}).observe(el('view'));
cameraAt(.65,1);appearance();pose(0);el('play').disabled=el('phase').disabled=false;el('status').textContent='Für den Namen eine Struktur antippen oder anklicken · Drehen durch Ziehen · Zoomen mit zwei Fingern oder Mausrad';
let last=0;renderer.setAnimationLoop(t=>{if(playing){time+=Math.min(.06,(t-last)/1000)*1.6;pose((1-Math.cos(time))/2)}last=t;renderer.render(scene,camera)});
})().catch(e=>document.getElementById('status').textContent='3D-Ansicht konnte nicht geladen werden: '+e.message);
</script></html>
