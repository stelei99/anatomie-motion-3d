<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07345b"><title>Anatomie Motion 3D – Trainingsatlas</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061e31;color:#eaf7fd;font:15px system-ui,Arial}header{padding:9px 12px;background:#07345b;border-bottom:3px solid #08a9ef}h1{font-size:19px;margin:0 0 2px}small{color:#c4dce9}main{max-width:1350px;margin:auto;padding:12px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,a.action{background:#164b6a;color:white;border:1px solid #4b7991;border-radius:9px;padding:11px 13px;font:inherit;cursor:pointer;text-decoration:none}button[aria-selected=true]{background:#08a9ef;color:#061e31;font-weight:700}.frame{width:100%;height:calc(100dvh - 185px);min-height:520px;border:1px solid #35617b;border-radius:12px;background:#102a3b}#notice{background:#0c3048;border-radius:9px;padding:10px;margin:8px 0;line-height:1.5}#loading{color:#ffcb05}footer{padding:8px;color:#c4dce9;font-size:12px}#notice{padding:7px 10px;font-size:12px}#notice:has(#loading:empty){display:none}a{color:#8bdcff}@media(max-width:650px){.frame{height:calc(100dvh - 150px);min-height:480px}.tabs{gap:5px;margin:7px 0}.tabs button{flex:1 1 30%;padding:9px 5px;font-size:12px}header small{font-size:11px}footer{display:none}}</style></head><body>
<header><h1>Anatomie Motion 3D</h1><small>Bewegliches 3D-Menschenmodell · Übungsanalyse</small></header>
<main>
<div id="notice" role="status"><span id="loading">Lade 3D-Modell …</span><strong id="heading" hidden>Übungsstudio 3D</strong><span id="description" hidden></span></div>
<iframe class="frame" id="module" title="Anatomie-3D-Modul" src="uebungen-3d.html?build=contact23" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>

<footer>Das Original-Rig ist die Grundlage der weiteren Entwicklung. Die Bewegungsvorschauen sind noch nicht biomechanisch validiert.</footer></main>
<script>
(()=>{'use strict';
const frame=document.getElementById('module'),buttons=[...document.querySelectorAll('[data-page]')],heading=document.getElementById('heading'),description=document.getElementById('description'),loading=document.getElementById('loading');
const pages={
'uebungen-3d.html':['Übungsstudio 3D','Mehrere Übungen mit dem beweglichen Original-Rig. Hüftbeugen sind noch vereinfachte Vorschauen.']};
function choose(page,writeHash=true){if(!Object.prototype.hasOwnProperty.call(pages,page))page='uebungen-3d.html';buttons.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.page===page)));heading.textContent=pages[page][0];description.textContent=pages[page][1];loading.textContent='Lade 3D-Modell …';if(frame.getAttribute('src')?.split('?')[0]!==page)frame.setAttribute('src',page+'?build=contact23');if(writeHash)history.replaceState(null,'','#'+encodeURIComponent(page));}
buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.page)));
frame.addEventListener('load',()=>{loading.textContent='';});
window.addEventListener('hashchange',()=>choose(decodeURIComponent(location.hash.slice(1)),false));
choose(decodeURIComponent(location.hash.slice(1)),false);
})();
</script></body></html>
